name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - run: dnf -y -q install git make qt6-qtdeclarative-devel qt6-qtshadertools
      - uses: actions/checkout@v5
      - run: make shaders
      - run: make test
      - run: make lint
